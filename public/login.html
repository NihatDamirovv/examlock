<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ExamLock — Giriş</title>
  <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        ExamLock
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- 1) Müəllim seçimi -->
    <section id="pick-view" class="gate">
      <h1>Müəllim paneli</h1>
      <p class="sub">Adınızı seçin və şifrənizi daxil edin.</p>
      <div id="teacher-grid" class="teacher-grid"></div>
      <div class="gate-foot"><button class="linklike" id="to-admin">Administrator girişi</button></div>
    </section>

    <!-- 2) Müəllimin şifrəsi -->
    <section id="pw-view" class="gate" hidden>
      <form id="teacher-form" class="card login" style="margin-top:0">
        <div class="pick">
          <div class="avatar" id="pw-avatar"></div>
          <div><div style="font-weight:700" id="pw-name"></div><div class="hint">Müəllim</div></div>
        </div>
        <label class="f" for="teacher-pw">Şifrə</label>
        <input id="teacher-pw" type="password" autocomplete="current-password" required>
        <div class="error" id="teacher-error"></div>
        <button class="primary" style="width:100%;justify-content:center">Daxil ol</button>
      </form>
      <div class="gate-foot"><button class="linklike" data-back>← Başqa müəllim</button></div>
    </section>

    <!-- 3) Admin -->
    <section id="admin-view" class="gate" hidden>
      <form id="admin-form" class="card login" style="margin-top:0">
        <h1>Administrator</h1>
        <label class="f" for="admin-pw">Şifrə</label>
        <input id="admin-pw" type="password" autocomplete="current-password" required>
        <div class="error" id="admin-error"></div>
        <button class="primary" style="width:100%;justify-content:center">Daxil ol</button>
      </form>
      <div class="gate-foot"><button class="linklike" data-back>← Müəllim girişi</button></div>
    </section>
  </main>

  <script src="/static/login.js?v=2"></script>
</body>
</html>
